const DECK=RAW_DATA.map((v,i)=>({id:'k'+i,src:v[0],read:v[1],ko:v[2],cat:v[3]}));
const DKEY='kanji1000_study_v1';const cats=[...new Set(DECK.map(x=>x.cat))];

const position={};const withinCategory={};for(const c of DECK){let n=withinCategory[c.cat]||0;position[c.id]=n*cats.length+cats.indexOf(c.cat);withinCategory[c.cat]=n+1}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayKey=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
function cleanState(o){let a=o&&typeof o==='object'?o:{};return {progress:a.progress&&typeof a.progress==='object'?a.progress:{},days:Array.isArray(a.days)?a.days:[],settings:{goal:[5,10,15,20,30].includes(a.settings?.goal)?a.settings.goal:10,ruby:a.settings?.ruby!==false}}}
let state;let storageAvailable=true;try{state=cleanState(JSON.parse(localStorage.getItem(DKEY)||'null'))}catch(e){state=cleanState(null);storageAvailable=false}
function save(){try{localStorage.setItem(DKEY,JSON.stringify(state));storageAvailable=true;$('storageWarn').style.display='none'}catch(e){storageAvailable=false;$('storageWarn').textContent='⚠️ 브라우저 저장이 제한돼 있어요. 기록이 유지되지 않을 수 있습니다. 일반 브라우저 창에서 열거나 JSON으로 백업해 주세요.';$('storageWarn').style.display='block'}}
let view='today',filterCat='',filterText='',activeId=null,revealed=false,hint=false,page=1;let sessionDone=new Set();let notice='';
function pieces(src){let out=[];let re=/([^\[\]]+)(?:\[([^\]]+)\])?/g,m;while((m=re.exec(src)))out.push({text:m[1],rt:m[2]||''});return out}
function plain(src){return src.replace(/\[[^\]]+\]/g,'')}
function ruby(src,hidden=false){let s=pieces(src).map(p=>p.rt?`<ruby>${esc(p.text)}<rt>${esc(p.rt)}</rt></ruby>`:esc(p.text)).join('');return `<span class="${hidden?'hideruby':''}">${s}</span>`}
const byId=id=>DECK.find(x=>x.id===id);
function prog(c){return state.progress[c.id]||null}
function newTodayCount(){let d=todayKey();return Object.values(state.progress).filter(p=>p.firstDay===d).length}
function dayReviewed(){let d=todayKey();return Object.values(state.progress).filter(p=>p.lastDay===d).length}
function dueCards(){let n=Date.now();return DECK.filter(c=>prog(c)&&Number(prog(c).due||0)<=n)}
function mastered(p){return !!p&&p.streak>=4&&p.interval>=14}
function streak(){let days=new Set(state.days);let d=new Date();if(!days.has(todayKey()))d.setDate(d.getDate()-1);let n=0;for(let i=0;i<365;i++){const k=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');if(!days.has(k))break;n++;d.setDate(d.getDate()-1)}return n}

    $("modeSel").value=state.settings.mode;
    let c=ensureActive(),main=c?(state.settings.mode==="quiz"?quizCard(c,candidates().length):mainCard(c,candidates().length)):emptyHtml();
    $("main").innerHTML=`<div class="workspace"><div>${main}</div>${sideHtml()}</div>${view==="all"?'<div style="height:16px"></div>'+listHtml():""}`;
    bindButtons();
  };
  function afterReview(){
    const now=Date.now();if(!state.settings.backupAnchor)state.settings.backupAnchor=now;
    save();backupSnapshot(now);if(state.settings.autoDownload&&now-(state.settings.lastExportAt||state.settings.backupAnchor)>=7*86400000)exportData(true);
  }
  function markAnswer(g){
    const c=byId(activeId),now=Date.now(),d=todayKey(),old=prog(c);
    if(!c)return;
    let p=old?{...old}:{seen:0,correct:0,wrong:0,streak:0,interval:0,due:0,firstDay:d};
    p.seen++;p.lastDay=d;p.lastAt=now;p.lastGrade=g;
    if(g===0){p.wrong++;p.streak=0;p.interval=0;p.due=now+600000}
    else if(g===1){p.hard=(p.hard||0)+1;p.streak=0;p.interval=1;p.due=now+86400000}
    else{p.correct++;p.streak++;p.interval=Math.max(1,Math.round((p.interval||1)*2.3));p.due=now+p.interval*86400000}
    state.progress[c.id]=p;if(!state.days.includes(d))state.days.push(d);state.days=state.days.slice(-400);sessionDone.add(c.id);afterReview();
  }
  function answer(i){if(chosen!==null||state.settings.mode!=="quiz"||!activeId)return;let c=byId(activeId),o=optionsFor(c);if(!o[i])return;chosen=i;markAnswer(o[i]===c.read?(helped?1:2):0);render();}
  function next(){activeId=null;resetQuiz();render();}
  bindButtons=function(){
    originalBind();
    document.querySelectorAll("[data-quiz-option]").forEach(b=>b.onclick=()=>answer(+b.dataset.quizOption));
    if($("quizHintBtn"))$("quizHintBtn").onclick=()=>{helped=true;render()};
    if($("nextQuizBtn"))$("nextQuizBtn").onclick=next;
    if($("autoBackupCheck"))$("autoBackupCheck").onchange=e=>{state.settings.autoDownload=e.target.checked;save();setNotice(e.target.checked?"주간 JSON 자동 다운로드를 켰어요.":"자동 다운로드를 껐어요.")};
    if($("restoreSnapshotBtn"))$("restoreSnapshotBtn").onclick=restoreSnapshot;
  };
  const originalExport=exportData;
  exportData=function(automatic){
    const auto=automatic===true;state.settings.lastExportAt=Date.now();save();
    const json=JSON.stringify({app:"읽히는 한자",version:1,exportedAt:new Date().toISOString(),count:DECK.length,state},null,2);
    let obj=new Blob([json],{type:"application/json;charset=utf-8"}),url=URL.createObjectURL(obj),a=document.createElement("a");
    a.href=url;a.download=`kanji-learning-backup-${todayKey()}${auto?"-weekly":""}.json`;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),6000);
    setNotice(auto?"주간 자동 JSON 다운로드를 시도했어요. 다운로드 목록을 확인해 주세요.":"JSON 백업 다운로드를 시도했어요. 저장 위치를 확인해 주세요.");
  };
  function openDB(){return new Promise((resolve,reject)=>{if(!("indexedDB"in window))return reject(Error("IndexedDB 없음"));let r=indexedDB.open("kanji-learning-snapshots-v1",1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("backups"))r.result.createObjectStore("backups",{keyPath:"at"})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
  async function backupSnapshot(now){
    if(now-(state.settings.lastSnapshotAt||0)<86400000)return;
    try{
      let db=await openDB(),data=JSON.stringify({app:"읽히는 한자",version:1,state});
      await new Promise((resolve,reject)=>{let tx=db.transaction("backups","readwrite");tx.objectStore("backups").put({at:now,json:data});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
      await new Promise((resolve,reject)=>{let tx=db.transaction("backups","readwrite"),req=tx.objectStore("backups").openCursor(null,"prev"),n=0;req.onsuccess=()=>{let c=req.result;if(c){if(++n>4)c.delete();c.continue()}};tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
      db.close();state.settings.lastSnapshotAt=now;save();
    }catch(_){}
  }
  async function restoreSnapshot(){
    try{
      const db=await openDB();
      const arr=await new Promise((resolve,reject)=>{let r=db.transaction("backups","readonly").objectStore("backups").getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)});
      db.close();if(!arr.length){alert("복원 가능한 로컬 스냅샷이 없어요.");return;}
      arr.sort((a,b)=>b.at-a.at);const o=JSON.parse(arr[0].json),count=Object.keys(o.state.progress||{}).length;
      if(!confirm(`${new Date(arr[0].at).toLocaleString("ko-KR")} 백업(${count}개 기록)으로 교체할까요?`))return;
      state=cleanState(o.state);resetQuiz();activeId=null;sessionDone.clear();save();setNotice("최근 스냅샷을 복원했어요.");render();
    }catch(e){alert("스냅샷 복원에 실패했어요. JSON 백업을 이용해 주세요.")}
  }
  grade=function(g){if(state.settings.mode!=="card")return;const id=activeId;originalGrade(g);if(id&&state.progress[id])afterReview();};
  setView=function(v){resetQuiz();originalSetView(v)};
  $("modeSel").addEventListener("change",e=>{state.settings.mode=e.target.value==="card"?"card":"quiz";resetQuiz();sessionDone.clear();activeId=null;save();render()});
  document.addEventListener("keydown",function(e){
    if(state.settings.mode!=="quiz"||!activeId||e.target.closest("input,select,textarea,button")||e.altKey||e.ctrlKey||e.metaKey)return;
    if(["1","2","3","4"].includes(e.key)&&chosen===null){e.preventDefault();e.stopImmediatePropagation();answer(+e.key-1)}
    else if(chosen!==null&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.stopImmediatePropagation();next()}
    else if(chosen===null&&e.key.toLowerCase()==="h"){e.preventDefault();e.stopImmediatePropagation();helped=true;render()}
    else if(e.key===" "){e.preventDefault();e.stopImmediatePropagation();}
  },true);
  render();
})();</script>
</body>
</html>
