<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Dela+Gothic+One&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Klee+One:wght@400;600&display=swap">
<style>
/* アニ耳 — 스타일
 * 콘셉트: 만화 원고지(스크린톤) 위의 쪽빛 잉크, 도장(朱)으로 찍는 출석 스탬프
 * 서체: Dela Gothic One(표제) · IBM Plex Sans KR(본문) · Klee One(일본어 학습 글자, 교과서 필기체)
 */
:root {
  --paper: #F3F5FA;
  --card: #FFFFFF;
  --card-2: #ECEFF7;
  --ink: #171A2B;
  --ink-2: #454B64;
  --muted: #767D97;
  --line: #DCE1EC;
  --ruri: #1E50A2;
  --ruri-2: #163C7A;
  --ruri-soft: #E1E9F7;
  --on-ruri: #FFFFFF;
  --shu: #D23F2A;
  --shu-soft: #FBE6E1;
  --gold: #C98A00;
  --gold-fill: #F2B400;
  --gold-soft: #FFF2CC;
  --ok: #1B7F50;
  --ok-soft: #DBF1E4;
  --bad: #BF3434;
  --bad-soft: #FBE2E2;
  --tone: rgba(23, 26, 43, .08);
  --shadow: 0 1px 2px rgba(23, 26, 43, .06), 0 10px 28px rgba(23, 26, 43, .07);
  --heat-0: #E6EAF3;
  --heat-1: #BCD0F0;
  --heat-2: #7FA3E3;
  --heat-3: #3F6FC4;
  --heat-4: #1E50A2;
  --radius: 16px;
  --font-body: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --font-jp: "Klee One", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", "Noto Sans JP", serif;
  --font-display: "Dela Gothic One", "Black Han Sans", "IBM Plex Sans KR", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F111B; --card: #181B29; --card-2: #20243A; --ink: #E8EBF5; --ink-2: #B4BACF; --muted: #858CA6; --line: #2C3149;
    --ruri: #82A6EF; --ruri-2: #A9C2F6; --ruri-soft: #1C2746; --on-ruri: #0C0F1A;
    --shu: #F06B53; --shu-soft: #3B1F1B; --gold: #F2C14E; --gold-fill: #F2C14E; --gold-soft: #3A3014;
    --ok: #52C890; --ok-soft: #133021; --bad: #F27D7D; --bad-soft: #3B1C1E;
    --tone: rgba(232, 235, 245, .07); --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .3);
    --heat-0: #1E2236; --heat-1: #22365F; --heat-2: #2F5294; --heat-3: #4C76C9; --heat-4: #82A6EF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F111B; --card: #181B29; --card-2: #20243A; --ink: #E8EBF5; --ink-2: #B4BACF; --muted: #858CA6; --line: #2C3149;
  --ruri: #82A6EF; --ruri-2: #A9C2F6; --ruri-soft: #1C2746; --on-ruri: #0C0F1A;
  --shu: #F06B53; --shu-soft: #3B1F1B; --gold: #F2C14E; --gold-fill: #F2C14E; --gold-soft: #3A3014;
  --ok: #52C890; --ok-soft: #133021; --bad: #F27D7D; --bad-soft: #3B1C1E;
  --tone: rgba(232, 235, 245, .07); --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .3);
  --heat-0: #1E2236; --heat-1: #22365F; --heat-2: #2F5294; --heat-3: #4C76C9; --heat-4: #82A6EF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button, [data-act] { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--ruri); outline-offset: 2px; border-radius: 8px; }
.jp { font-family: var(--font-jp); font-weight: 600; }
ruby rt { font-size: .5em; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.no-furi ruby rt { display: none; }
.tabnum { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* ---------- 앱 셸 ---------- */
.shell { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.topbar {
  /* 휴대폰 상태 표시줄(시계·배터리) 높이만큼 위 여백을 넣고 맨 위(0)에 붙임 — 상태 표시줄 밑까지 제목줄 배경이 덮어
     처음 화면에서 제목줄이 가려지지 않고, 스크롤할 때 본문이 제목줄 위로 비치지 않게 */
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--font-display); font-size: 18px; letter-spacing: .02em; display: flex; align-items: center; gap: 6px; margin-right: auto; }
.brand .mark { width: 26px; height: 26px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--line);
  font-size: 13px; font-weight: 600; white-space: nowrap;
}
.chip svg { width: 16px; height: 16px; }
.chip.streak svg { color: var(--shu); }
.chip.xp svg { color: var(--gold-fill); }
.chip.rank { font-family: var(--font-display); font-weight: 400; color: var(--shu); border-color: var(--shu-soft); }

main.view { flex: 1; padding: 16px 16px 110px; display: flex; flex-direction: column; gap: 18px; }
/* 구글 플레이 판의 광고 배너(홈·나 화면, 탭 막대 바로 위)만큼 본문 아래 여백을 늘림 — 높이는 app/native.js가 --ad-h로 넣음 */
.has-ad main.view { padding-bottom: calc(110px + var(--ad-h, 0px)); }
.has-ad .toast { bottom: calc(90px + var(--ad-h, 0px) + env(safe-area-inset-bottom, 0px)); }
.lic { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--ink-2); }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--card); border-top: 1px solid var(--line);
}
.tabbar .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab {
  background: none; border: 0; padding: 8px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 11px; color: var(--muted); position: relative;
}
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--ruri); font-weight: 700; }
.tab .dot { position: absolute; top: 5px; left: calc(50% + 8px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--shu); color: #fff; font-size: 10px; line-height: 17px; font-weight: 700; }

/* ---------- 공통 카드/버튼 ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.sec-title { display: flex; align-items: baseline; gap: 8px; justify-content: space-between; }
.sec-title h2 { font-size: 17px; }
.sec-title .jp { color: var(--muted); font-size: 13px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 14px; padding: 14px 18px; font-weight: 700; font-size: 16px;
  background: var(--ruri); color: var(--on-ruri);
  box-shadow: 0 3px 0 var(--ruri-2);
  transition: transform .06s ease, box-shadow .06s ease;
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ruri-2); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.block { width: 100%; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 3px 0 var(--line); }
.btn.shu { background: var(--shu); color: #fff; box-shadow: 0 3px 0 color-mix(in srgb, var(--shu) 70%, #000); }
.btn.ok { background: var(--ok); color: #fff; box-shadow: 0 3px 0 color-mix(in srgb, var(--ok) 70%, #000); }
.btn.bad { background: var(--bad); color: #fff; box-shadow: 0 3px 0 color-mix(in srgb, var(--bad) 70%, #000); }
a.btn { text-decoration: none; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn.sm { padding: 8px 12px; font-size: 14px; border-radius: 10px; }
.btn.sm svg { width: 16px; height: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.seg { display: inline-flex; background: var(--card-2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 7px 14px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
.tone { background-image: radial-gradient(var(--tone) 1.1px, transparent 1.4px); background-size: 7px 7px; }

.audio-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 0; flex: none;
  display: inline-grid; place-items: center;
  background: var(--ruri-soft); color: var(--ruri);
}
.audio-btn svg { width: 22px; height: 22px; }
.audio-btn.big { width: 88px; height: 88px; background: var(--ruri); color: var(--on-ruri); box-shadow: 0 4px 0 var(--ruri-2); }
.audio-btn.big svg { width: 40px; height: 40px; }
.audio-btn.slow { background: var(--card-2); color: var(--ink-2); }
.audio-btn.playing { animation: pulse 1s ease-in-out infinite; }
/* 다른 목소리로 듣기 */
.voice-btn { display: inline-flex; align-items: center; gap: 6px; align-self: center; margin: 2px auto 0; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ruri); font: 600 13px/1.2 var(--font-body); white-space: nowrap; }
.voice-btn svg { width: 15px; height: 15px; flex: none; }
.voice-btn.playing { border-color: var(--ruri); background: var(--ruri-soft); }
.q-prompt .voice-btn, .lcard .voice-btn, .sheet .voice-btn { display: flex; }
@keyframes pulse { 50% { transform: scale(1.06); } }

.banner { border-radius: 12px; padding: 12px 14px; background: var(--gold-soft); color: var(--ink); font-size: 14px; border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); }
.banner b { color: var(--gold); }

/* ---------- 홈: 오늘의 에피소드 ---------- */
.today {
  position: relative; overflow: hidden;
  border-radius: 22px; padding: 20px 18px 18px;
  background: var(--card); border: 2px solid var(--ink);
  box-shadow: 6px 6px 0 var(--ink);
}
.today::before { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(var(--tone) 1.1px, transparent 1.4px); background-size: 7px 7px; mask-image: linear-gradient(135deg, #000 0%, transparent 55%); -webkit-mask-image: linear-gradient(135deg, #000 0%, transparent 55%); }
.today > * { position: relative; }
.ep-no { font-family: var(--font-display); font-size: 15px; color: var(--shu); letter-spacing: .04em; }
.ep-title { font-family: var(--font-display); font-size: 26px; line-height: 1.25; margin: 4px 0 2px; }
.ep-sub { color: var(--ink-2); font-size: 14px; }
.type-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 6px; background: var(--ruri-soft); color: var(--ruri); }
.type-badge.boss { background: var(--shu-soft); color: var(--shu); }
.type-badge.listen { background: var(--ok-soft); color: var(--ok); }
.type-badge.exam { background: var(--gold-soft); color: var(--gold); }
.type-badge svg { width: 14px; height: 14px; }
.flow { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 16px; }
.flow span { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--card-2); color: var(--ink-2); }
.flow span b { color: var(--ink); }
.goal-line { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin-top: 12px; }
.goal-line b { color: var(--ink); }

/* ---------- 챕터 선택 & 스탬프 카드 ---------- */
.chapters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.chapters::-webkit-scrollbar { display: none; }
.chap {
  flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 12px; text-align: left; min-width: 118px;
}
.chap .n { font-family: var(--font-display); font-size: 12px; color: var(--muted); }
.chap .t { font-weight: 700; font-size: 14px; }
.chap .r { font-size: 11px; color: var(--muted); }
.chap.on { border-color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.chap.lock { opacity: .55; }

.stampcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 12px; }
.stampcard header { display: flex; justify-content: space-between; align-items: baseline; margin: 0 4px 10px; gap: 8px; }
.stampcard header h3 { font-size: 15px; }
.stampcard header .jp { font-size: 13px; color: var(--muted); }
.weekrow { display: grid; grid-template-columns: 34px repeat(7, 1fr); gap: 5px; align-items: center; margin-bottom: 5px; }
.weekrow .wk { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.2; }
.cell {
  position: relative; aspect-ratio: 1; max-width: 100%;
  border: 1px dashed color-mix(in srgb, var(--muted) 45%, transparent);
  border-radius: 10px; background: var(--paper);
  display: grid; place-items: center; padding: 0;
  font-family: var(--font-display); font-size: 13px; color: var(--ink-2);
}
.cell .ic { position: absolute; top: 3px; right: 3px; width: 12px; height: 12px; color: var(--muted); }
.cell.boss { border-style: solid; border-color: var(--shu-soft); background: color-mix(in srgb, var(--shu-soft) 55%, var(--paper)); }
.cell.listen { border-style: solid; border-color: var(--ok-soft); }
.cell.exam { border-style: solid; border-color: color-mix(in srgb, var(--gold) 40%, transparent); background: color-mix(in srgb, var(--gold-soft) 60%, var(--paper)); }
.cell.lock { opacity: .4; }
.cell.cur { border: 2px solid var(--ruri); color: var(--ruri); background: var(--ruri-soft); animation: breathe 2s ease-in-out infinite; }
@keyframes breathe { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--ruri) 18%, transparent); } }
.cell.done { color: transparent; border-style: solid; border-color: var(--line); background: var(--card); }
.cell .stamp { position: absolute; inset: 8%; }
.cell .num-under { position: absolute; bottom: 2px; left: 4px; font-size: 9px; color: var(--muted); font-family: var(--font-body); }
.stamp-svg { width: 100%; height: 100%; color: var(--shu); transform: rotate(-9deg); }
.lastrow { grid-template-columns: 34px repeat(2, 1fr) 5fr; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 8px 4px 0; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }

/* ---------- 바텀시트 / 모달 ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; }
.scrim { position: absolute; inset: 0; background: rgba(10, 12, 22, .45); animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px; max-height: 88%;
  overflow: auto; background: var(--card); border-radius: 22px 22px 0 0;
  padding: 10px 18px calc(22px + env(safe-area-inset-bottom, 0px));
  animation: up .25s cubic-bezier(.2, .8, .2, 1);
}
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sheet h2 { font-family: var(--font-display); font-size: 22px; font-weight: 400; margin: 4px 0; }
.kchips { display: flex; flex-wrap: wrap; gap: 6px; }
.kchips span, .kchips button { font-family: var(--font-jp); font-weight: 600; font-size: 20px; min-width: 38px; text-align: center; padding: 2px 6px; border-radius: 8px; background: var(--card-2); border: 0; color: var(--ink); }
.list-plain { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.list-plain li { display: flex; gap: 8px; align-items: baseline; font-size: 14px; }
.list-plain li .jp { font-size: 16px; }

/* ---------- 레슨 러너 ---------- */
.runner { position: fixed; inset: 0; z-index: 60; background: var(--paper); display: flex; flex-direction: column; }
.run-top {
  display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
  max-width: 560px; width: 100%; margin: 0 auto;
}
.icon-btn { border: 0; background: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; color: var(--muted); flex: none; }
.icon-btn svg { width: 24px; height: 24px; }
.pbar { flex: 1; height: 12px; border-radius: 6px; background: var(--card-2); overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--ruri); border-radius: 6px; transition: width .3s ease; }
.pbar.test i { background: var(--shu); }
.run-label { font-size: 12px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.run-body { flex: 1; overflow-y: auto; }
.run-body .in { max-width: 560px; margin: 0 auto; padding: 8px 18px 24px; display: flex; flex-direction: column; gap: 16px; }
.run-foot { max-width: 560px; width: 100%; margin: 0 auto; padding: 12px 18px calc(16px + env(safe-area-inset-bottom, 0px)); }

.q-head { font-size: 15px; font-weight: 700; color: var(--ink-2); }
.q-prompt { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 0 4px; text-align: center; }
.jp-big { font-family: var(--font-jp); font-weight: 600; font-size: 96px; line-height: 1.1; }
.jp-word { font-family: var(--font-jp); font-weight: 600; font-size: 40px; line-height: 1.25; }
.ro-big { font-family: var(--font-display); font-size: 54px; line-height: 1.1; color: var(--ruri); }
.ko-big { font-size: 26px; font-weight: 700; }
.q-small { color: var(--muted); font-size: 15px; }
.q-sent { font-family: var(--font-jp); font-weight: 600; font-size: 24px; line-height: 2; text-align: center; }
.q-sent .blank { display: inline-block; min-width: 2.2em; border-bottom: 3px solid var(--ruri); margin: 0 3px; color: transparent; }
.q-ko { color: var(--ink-2); font-size: 15px; background: var(--card-2); padding: 6px 12px; border-radius: 10px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opts.one { grid-template-columns: 1fr; }
.opt {
  border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 14px 10px; min-height: 58px;
  font-size: 17px; font-weight: 600; line-height: 1.35; box-shadow: 0 3px 0 var(--line); text-align: center;
}
.opt.jp-opt { font-family: var(--font-jp); font-size: 24px; }
.opt.ko-opt { font-size: 15px; text-align: left; padding: 12px 14px; }
.opt:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.opt.sel-ok { border-color: var(--ok); background: var(--ok-soft); box-shadow: 0 3px 0 var(--ok); }
.opt.sel-bad { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 3px 0 var(--bad); }
.opt.show-ok { border-color: var(--ok); }
.opts.locked .opt { pointer-events: none; }

.order-tray { min-height: 64px; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0; align-content: flex-start; }
.order-bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding-top: 8px; }
.tok { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 6px 12px; font-family: var(--font-jp); font-weight: 600; font-size: 20px; box-shadow: 0 3px 0 var(--line); line-height: 1.9; }
.tok.used { visibility: hidden; }

.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match .col { display: flex; flex-direction: column; gap: 10px; }
.mbtn { border: 2px solid var(--line); background: var(--card); border-radius: 12px; min-height: 54px; padding: 8px; font-weight: 600; box-shadow: 0 3px 0 var(--line); font-size: 14px; }
.mbtn.jp { font-family: var(--font-jp); font-size: 22px; }
.mbtn.sel { border-color: var(--ruri); background: var(--ruri-soft); }
.mbtn.gone { opacity: .25; pointer-events: none; }
.mbtn.shake { animation: shake .3s; border-color: var(--bad); }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

.feedback {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
  padding: 16px 18px calc(18px + env(safe-area-inset-bottom, 0px));
  animation: up .2s ease;
}
.feedback.ok { background: var(--ok-soft); border-top: 2px solid var(--ok); }
.feedback.bad { background: var(--bad-soft); border-top: 2px solid var(--bad); }
.feedback .in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.fb-title { font-size: 19px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.feedback.ok .fb-title { color: var(--ok); }
.feedback.bad .fb-title { color: var(--bad); }
.reveal { display: flex; gap: 12px; align-items: center; }
.reveal .txt { flex: 1; min-width: 0; }
.reveal .jp { font-size: 20px; line-height: 1.7; }
.reveal .kana { font-size: 13px; color: var(--ink-2); }
.reveal .ko { font-size: 14px; }

.stamp-pop { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; pointer-events: none; }
.stamp-pop .mark { width: 180px; height: 180px; animation: stampin .35s cubic-bezier(.2, 1.4, .4, 1); }
.stamp-pop .mark.ok { color: var(--shu); }
.stamp-pop .mark.bad { color: var(--ruri); }
@keyframes stampin { from { transform: scale(2.2) rotate(-18deg); opacity: 0; } to { transform: scale(1) rotate(-8deg); opacity: .92; } }

/* 학습 카드 */
.lcard { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.lcard .kind { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.glyph-wrap { display: flex; align-items: center; justify-content: center; gap: 18px; }
.glyph { font-family: var(--font-jp); font-weight: 600; font-size: 128px; line-height: 1.05; }
.glyph-ro { font-family: var(--font-display); font-size: 30px; color: var(--ruri); }
.mn { background: var(--card-2); border-radius: 12px; padding: 12px 14px; font-size: 15px; }
.mn b { color: var(--shu); }
.origin { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--ink-2); }
.origin .oj { font-family: var(--font-jp); font-size: 34px; font-weight: 600; color: var(--ink); }
.vocab-main { text-align: center; }
.vocab-main .r { font-family: var(--font-jp); font-weight: 600; font-size: 44px; line-height: 1.2; }
.vocab-main .w { font-family: var(--font-jp); font-size: 20px; color: var(--ink-2); }
.vocab-main .ro { font-size: 14px; color: var(--muted); letter-spacing: .04em; }
.vocab-main .m { font-size: 22px; font-weight: 700; margin-top: 6px; }
.hint { font-size: 13px; color: var(--ink-2); background: var(--gold-soft); border-radius: 8px; padding: 4px 10px; align-self: center; }
.gram-title { font-family: var(--font-jp); font-size: 26px; font-weight: 600; }
.gram-m { font-weight: 700; color: var(--ruri); }
.gram-d { font-size: 15px; line-height: 1.75; }
.gram-d b { color: var(--shu); font-weight: 700; }
.ex { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px dashed var(--line); }
.ex:first-child { border-top: 0; }
.ex .txt { flex: 1; min-width: 0; }
.ex .jp { font-size: 20px; line-height: 1.9; }
.ex .ko { font-size: 14px; color: var(--ink-2); }
.ex .kana { font-size: 12px; color: var(--muted); }
.card-nav { display: flex; gap: 10px; }
.card-nav .btn { flex: 1; }
.counter { text-align: center; font-size: 13px; color: var(--muted); }

/* 대사·대화 */
.line-card { border-radius: 22px; padding: 22px 18px; background: var(--ink); color: var(--paper); position: relative; overflow: hidden; }
.line-card::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255, 255, 255, .06) 1.1px, transparent 1.4px); background-size: 7px 7px; pointer-events: none; }
.line-card > * { position: relative; }
.line-card .eyebrow { color: color-mix(in srgb, var(--paper) 65%, transparent); }
.line-card .jp { font-size: 30px; line-height: 1.9; margin: 8px 0; }
.line-card ruby rt { color: color-mix(in srgb, var(--paper) 60%, transparent); }
.line-card .ko { font-size: 16px; color: var(--gold-fill); }
.speed { display: flex; gap: 8px; flex-wrap: wrap; }
.speed button { border: 1px solid color-mix(in srgb, var(--paper) 30%, transparent); background: transparent; color: var(--paper); border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.speed button svg { width: 16px; height: 16px; }
.shadow-count { display: flex; gap: 6px; }
.shadow-count i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ruri); }
.shadow-count i.on { background: var(--ruri); }
.dlg { display: flex; flex-direction: column; gap: 8px; }
.dlg .ln { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 12px; background: var(--card-2); border: 2px solid transparent; }
.dlg .ln.b { background: var(--ruri-soft); }
.dlg .ln.now { border-color: var(--ruri); }
.dlg .who { font-size: 12px; font-weight: 700; color: var(--muted); min-width: 48px; font-family: var(--font-jp); }
.dlg .jp { font-size: 18px; line-height: 1.8; }
.dlg .ko { font-size: 13px; color: var(--ink-2); }
.dlg .hid { color: var(--muted); letter-spacing: .2em; }

.note-card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 22px 20px; }
.note-card h3 { font-size: 21px; line-height: 1.4; margin: 6px 0 12px; }
.note-card p { margin: 0 0 12px; line-height: 1.85; font-size: 16px; max-width: 65ch; }

/* 인트로 · 결과 */
.titlecard { text-align: center; padding: 30px 12px 20px; border-radius: 24px; border: 2px solid var(--ink); background: var(--card); box-shadow: 6px 6px 0 var(--ink); position: relative; overflow: hidden; }
.titlecard::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(var(--tone) 1.1px, transparent 1.4px); background-size: 7px 7px; mask-image: radial-gradient(circle at 50% 110%, #000 0%, transparent 70%); -webkit-mask-image: radial-gradient(circle at 50% 110%, #000 0%, transparent 70%); }
.titlecard > * { position: relative; }
.titlecard .ep { font-family: var(--font-display); font-size: 40px; color: var(--shu); }
.titlecard h1 { font-family: var(--font-display); font-weight: 400; font-size: 30px; margin: 6px 0; }
.steps-list { display: flex; flex-direction: column; gap: 8px; }
.steps-list div { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.steps-list .n { width: 26px; height: 26px; border-radius: 50%; background: var(--card-2); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
.boss-card { text-align: center; padding: 22px 16px; border-radius: 24px; background: var(--ink); color: var(--paper); position: relative; overflow: hidden; }
.boss-card .name { font-family: var(--font-display); font-size: 30px; margin: 6px 0; }
.boss-card .sub { opacity: .75; font-size: 14px; }
.boss-svg { width: 120px; height: 120px; margin: 6px auto 0; display: block; color: var(--shu); }
.hpbar { height: 14px; border-radius: 7px; background: color-mix(in srgb, var(--shu) 22%, transparent); overflow: hidden; }
.hpbar i { display: block; height: 100%; background: var(--shu); transition: width .35s ease; }
.hearts { display: flex; gap: 4px; justify-content: center; }
.hearts svg { width: 18px; height: 18px; color: var(--shu); }
.hearts svg.off { color: var(--line); }
.boss-hud { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
.boss-hud .t { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; }
.boss-hud .jp { color: var(--shu); }
.hit { animation: hit .35s; }
@keyframes hit { 30% { transform: translateX(-6px) rotate(-2deg); } 60% { transform: translateX(6px) rotate(2deg); } }

.result { text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center; }
.result .big-stamp { width: 170px; height: 170px; color: var(--shu); animation: stampin .45s cubic-bezier(.2, 1.4, .4, 1) both; }
.result .big-stamp.fail { color: var(--ruri); }
.result .score { font-family: var(--font-display); font-size: 56px; line-height: 1; }
.result .score small { font-size: 22px; }
.result .verdict { font-size: 18px; font-weight: 800; }
.xp-rows { width: 100%; display: flex; flex-direction: column; gap: 6px; }
.xp-rows div { display: flex; justify-content: space-between; font-size: 14px; padding: 6px 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }
.xp-rows b { color: var(--gold); }
.lvl { width: 100%; }
.lvl .bar { height: 10px; border-radius: 5px; background: var(--gold-soft); overflow: hidden; }
.lvl .bar i { display: block; height: 100%; background: var(--gold-fill); }
.lvl .t { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }
.newbadge { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--gold-soft); width: 100%; text-align: left; }
.newbadge svg { width: 36px; height: 36px; flex: none; }
.wrong-list { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 8px; }
.wrong-list .w { display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.wrong-list .w .txt { flex: 1; min-width: 0; }
.wrong-list .jp { font-size: 17px; }
.sections { width: 100%; display: flex; flex-direction: column; gap: 8px; }
.sections .s { display: grid; grid-template-columns: 56px 1fr 44px; gap: 10px; align-items: center; font-size: 13px; }
.meter { height: 10px; border-radius: 5px; background: var(--ruri-soft); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ruri); border-radius: 5px; }
.rankup { width: 100%; padding: 18px; border-radius: 18px; background: var(--ink); color: var(--paper); }
.rankup .r { font-family: var(--font-display); font-size: 64px; color: var(--gold-fill); line-height: 1; }

/* ---------- 복습 탭 ---------- */
.hero-num { font-family: var(--font-body); font-weight: 700; font-size: 52px; line-height: 1; }
.boxes { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; align-items: end; height: 90px; }
.boxes .b { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.boxes .b i { width: 100%; max-width: 24px; background: var(--ruri); border-radius: 4px 4px 0 0; min-height: 2px; }
.boxes .b span { font-size: 11px; color: var(--muted); }
.boxes .b em { font-style: normal; font-size: 11px; color: var(--ink-2); }
.item-row { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.item-row:first-child { border-top: 0; }
.item-row .txt { flex: 1; min-width: 0; }
.item-row .jp { font-size: 19px; }
.item-row .m { font-size: 13px; color: var(--ink-2); }
.dots { display: flex; gap: 3px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--ruri); }

/* ---------- 문자표 ---------- */
.kgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.kgrid.three { grid-template-columns: repeat(3, 1fr); }
.kcell { border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 6px 0 4px; display: flex; flex-direction: column; align-items: center; min-height: 62px; }
.kcell .c { font-family: var(--font-jp); font-weight: 600; font-size: 26px; line-height: 1.2; }
.kcell .r { font-size: 11px; color: var(--muted); }
.kcell.empty { border: 0; background: none; }
.kcell.m1 { background: var(--ruri-soft); }
.kcell.m2 { background: color-mix(in srgb, var(--ruri) 40%, var(--card)); }
.kcell.m3 { background: var(--ruri); color: var(--on-ruri); border-color: var(--ruri); }
.kcell.m3 .r { color: color-mix(in srgb, var(--on-ruri) 75%, transparent); }
.kcell.m4 { background: var(--gold-fill); color: #1a1400; border-color: var(--gold); }
.kcell.m4 .r { color: #4a3a00; }
.kcell.nolearn .c { color: var(--muted); }

canvas.pad { width: 100%; max-width: 300px; aspect-ratio: 1; border-radius: 16px; border: 2px dashed var(--line); background: var(--card); touch-action: none; align-self: center; }

/* ---------- 학습 노트 ---------- */
.seg.wide { display: flex; width: 100%; }
.seg.wide button { flex: 1; padding: 8px 6px; white-space: nowrap; }
.day-h { font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 12px 0 0; padding-top: 6px; }
.day-h .tabnum { color: var(--ruri); }
details.gitem.note summary { align-items: center; }
details.gitem.note .nt { font-weight: 700; font-size: 16px; line-height: 1.4; }
.note-body p { margin: 0 0 10px; line-height: 1.85; font-size: 15px; }
/* 문법 자세히: 왜 그럴까 · 예문 더 보기 · 비교·주의 · 애니에서는 */
.gsec { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; display: flex; flex-direction: column; gap: 6px; }
.gsec-h { font-size: 13px; font-weight: 800; letter-spacing: .03em; color: var(--ruri); }
.gsec.why .gsec-h { color: var(--shu); }
.gsec.anime .gsec-h { color: var(--ink-2); }
.gram-d p { margin: 0 0 10px; }
.gram-d p:last-child { margin-bottom: 0; }
.gram-d table.gtab { border-collapse: collapse; width: 100%; font-size: 13.5px; margin: 4px 0 10px; }
.gram-d table.gtab th, .gram-d table.gtab td { border: 1px solid var(--line); padding: 6px 6px; text-align: left; vertical-align: top; word-break: keep-all; overflow-wrap: break-word; }
.gram-d table.gtab th { background: var(--card-2); font-weight: 700; }
.gram-d table.gtab th:first-child, .gram-d table.gtab td:first-child { white-space: nowrap; }
.gram-d .jp, .gram-d table.gtab .jp { font-family: var(--font-jp); }
.ex .note { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
/* 지난 화 다시 읽기 */
.sheet.tall { max-height: 94%; }
.rv-sec { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.rv-sec.note-card { border-radius: 0; border-width: 1px 0 0; padding: 12px 0 0; }
.rv-gram { display: flex; flex-direction: column; gap: 10px; padding: 8px 0 14px; }
.rv-gram + .rv-gram { border-top: 1px dashed var(--line); padding-top: 14px; }

/* ---------- 단어장 ---------- */
.search { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 14px; font-size: 16px; color: var(--ink); }
.group-h { font-size: 12px; font-weight: 700; color: var(--muted); margin: 14px 0 4px; letter-spacing: .04em; }
details.gitem { border-top: 1px solid var(--line); padding: 10px 0; }
details.gitem summary { list-style: none; display: flex; gap: 10px; align-items: baseline; }
details.gitem summary::-webkit-details-marker { display: none; }
details.gitem summary .jp { font-size: 18px; }
details.gitem[open] summary { margin-bottom: 8px; }

/* ---------- 나(통계) ---------- */
.profile { display: flex; gap: 16px; align-items: center; }
.rank-emblem { width: 84px; height: 84px; flex: none; position: relative; color: var(--shu); }
.rank-emblem svg { width: 100%; height: 100%; }
.rank-emblem b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 400; font-size: 38px; color: var(--shu); }
.rank-title { font-family: var(--font-jp); font-size: 18px; font-weight: 600; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.tile .l { font-size: 12px; color: var(--muted); }
.tile .v { font-size: 26px; font-weight: 700; line-height: 1.2; }
.tile .v small { font-size: 14px; color: var(--muted); font-weight: 500; }
.skill { display: grid; grid-template-columns: 64px 1fr 42px; gap: 10px; align-items: center; font-size: 14px; margin: 8px 0; }
.skill .v { text-align: right; font-size: 13px; color: var(--ink-2); }
.chart-wrap { position: relative; }
.chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart-tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -120%); }
.heat { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; grid-template-rows: repeat(7, auto); gap: 3px; }
.heat i { width: 100%; aspect-ratio: 1; border-radius: 3px; background: var(--heat-0); }
.heat i.h1 { background: var(--heat-1); } .heat i.h2 { background: var(--heat-2); } .heat i.h3 { background: var(--heat-3); } .heat i.h4 { background: var(--heat-4); }
.heat-legend { display: flex; gap: 4px; align-items: center; font-size: 11px; color: var(--muted); justify-content: flex-end; margin-top: 6px; }
.heat-legend i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.badge { text-align: center; font-size: 12px; padding: 10px 6px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.badge svg { width: 44px; height: 44px; }
.badge.off { opacity: .45; filter: grayscale(1); }
.badge b { font-size: 12px; }
.badge span { font-size: 11px; color: var(--muted); line-height: 1.3; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.set-row:first-of-type { border-top: 0; }
.set-row .l { font-size: 15px; }
.set-row .d { font-size: 12px; color: var(--muted); }
/* 설명이 길어도 선택 버튼은 줄지 않게 (좁은 폰에서 '자/동'처럼 글자가 꺾이던 문제) */
.set-row .seg { flex: none; }
.set-row .seg button { white-space: nowrap; }
.switch { width: 50px; height: 30px; border-radius: 15px; background: var(--line); border: 0; position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.switch.on { background: var(--ruri); }
.switch.on::after { transform: translateX(20px); }
select, input[type="range"] { font: inherit; color: var(--ink); }
select { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px; max-width: 180px; }
input[type="range"] { accent-color: var(--ruri); width: 140px; }
.danger-zone { border: 1px solid var(--bad-soft); border-radius: 14px; padding: 12px; }

.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 90; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-size: 14px; box-shadow: var(--shadow); animation: up .2s ease; max-width: calc(100% - 32px); }

/* 온보딩 */

      prompt: { audio: k.c, q: '들리는 글자를 고르세요' },
      optCls: 'jp-opt',
      reveal: { big: k.c, sub: k.ro, audio: k.c }
    }, k.c, wr.map(function (x) { return x.c; }));
  }
  function kanaFromRomaji(k) {
    var wr = kanaDistractors(k, 3);
    return mkChoice({
      item: k, section: 'kana', listening: false, type: 'kanaRomaji',
      prompt: { big: k.ro, cls: 'ro-big', q: '이 소리를 나타내는 글자는?' },
      optCls: 'jp-opt',
      reveal: { big: k.c, sub: k.ro, audio: k.c }
    }, k.c, wr.map(function (x) { return x.c; }));
  }

  /* ---------- 어휘 ---------- */
  function vocabReveal(v) {
    return { big: v.r, kanji: vocabLabel(v), sub: romajiOn(v) ? (v.ro || C.romaji(v.r)) : '', ko: v.m, audio: v.r, hint: v.h };
  }
  // 같은 소리(동음이의어)의 단어는 오답 보기에서 제외: 듣기 문제에서 정답이 둘이 되지 않도록
  function vocabOthers(v) { var r = C.toHira(v.r); return nearFirst(vocabPool(), v).filter(function (x) { return C.toHira(x.r) !== r; }); }
  // 헷갈리는 보기 (js/drill.js): 소리가 1~2박 다른 말 · 같은 한자 · 같은 화(같은 주제)의 말을 먼저. 그 화까지 나온 말 중에서
  function confusable(v) {
    if (!JP.drill) return null;
    var pool = vocabPool().filter(function (x) { return x.day <= (v.day || 1) + 2; });
    var wr = JP.drill.confusableVocab(v, 3, pool.length >= 8 ? pool : vocabPool());
    return wr.length >= 3 ? wr : null;
  }
  function vocabMeaning(v) {
    var wr = confusable(v) || distinct(vocabOthers(v), 3, function (x) { return x.m; }, [v.m]);
    return mkChoice({
      item: v, section: 'vocab', listening: false, type: 'vocabMeaning',
      prompt: { big: v.r, cls: 'jp-word', small: vocabLabel(v), ro: romajiOn(v) ? (v.ro || C.romaji(v.r)) : '', q: '뜻을 고르세요', audioBtn: v.r },
      reveal: vocabReveal(v)
    }, v.m, wr.map(function (x) { return x.m; }));
  }
  function vocabListen(v) {
    var wr = confusable(v) || distinct(vocabOthers(v), 3, function (x) { return x.m; }, [v.m]);
    return mkChoice({
      item: v, section: 'listen', listening: true, type: 'vocabListen',
      prompt: { audio: v.r, q: '듣고 뜻을 고르세요' },
      reveal: vocabReveal(v)
    }, v.m, wr.map(function (x) { return x.m; }));
  }
  function vocabReverse(v) {
    var wr = confusable(v) || distinct(vocabOthers(v), 3, function (x) { return x.r; }, [v.r]);
    // 뜻이 같은 단어가 오답으로 섞이지 않도록
    wr = wr.filter(function (x) { return x.m !== v.m; });
    while (wr.length < 3) {
      var extra = U.pick(vocabPool());
      if (extra.r !== v.r && extra.m !== v.m && wr.every(function (w) { return w.r !== extra.r; })) wr.push(extra);
    }
    return mkChoice({
      item: v, section: 'vocab', listening: false, type: 'vocabReverse',
      prompt: { big: v.m, cls: 'ko-big', q: '일본어로 고르세요' },
      optCls: 'jp-opt',
      reveal: vocabReveal(v)
    }, v.r, wr.map(function (x) { return x.r; }));
  }

  /* ---------- 문장 ---------- */
  function sentReveal(s) { return { html: s.html, kana: s.kana, ko: s.ko, audio: s.plain }; }
  function translationDistractors(s, item) {
    var pool = nearFirst(sentPool(), item || { ch: 1 });
    return distinct(pool.map(function (p) { return p.s; }), 3, function (x) { return x.ko; }, [s.ko]).map(function (x) { return x.ko; });
  }
  function sentListen(s, item, section) {
    // 문법 예문은 같은 문법의 다른 예문(구조가 같음)을 먼저 보기로 (js/drill.js)
    var wr = JP.drill ? JP.drill.sentDistractors(s, item, 3) : [];
    if (wr.length < 3) wr = translationDistractors(s, item);
    return mkChoice({
      item: item, section: section || 'listen', listening: true, type: 'sentListen', sent: s,
      prompt: { audio: s.plain, q: '듣고 뜻을 고르세요' },
      optCls: 'ko-opt',
      reveal: sentReveal(s)
    }, s.ko, wr);
  }
  // 서로 바꿔 써도 맞는 조사 짝 (방향의 へ/に, 나열의 と/や, 관계절의 の/が, 출발점의 から/より): 빈칸 오답 보기로 채우지 않음
  var SAME_OK = { 'へ': ['に'], 'に': ['へ', 'と'], 'と': ['や', 'に'], 'や': ['と'], 'の': ['が'], 'が': ['の'], 'から': ['より'], 'より': ['から'] };
  function cloze(s, gp) {
    var ans = s.cloze.answer, same = SAME_OK[ans] || [];
    var wr = s.cloze.opts.length ? s.cloze.opts.slice() : [];
    if (wr.length < 3) wr = wr.concat(U.shuffle((gp.o || []).filter(function (o) { return o !== ans && wr.indexOf(o) < 0; })));
    if (wr.length < 3) wr = wr.concat(U.shuffle(PARTICLES.filter(function (o) { return o !== ans && wr.indexOf(o) < 0 && same.indexOf(o) < 0; })));
    wr = wr.slice(0, 3);
    return mkChoice({
      item: gp, section: 'gram', listening: false, type: 'cloze', sent: s,
      prompt: { html: C.clozeHtml(s), ko: s.ko, q: '빈칸에 알맞은 말은?' },
      optCls: 'jp-opt',
      optHtml: true,
      reveal: sentReveal(s)
    }, C.rubyHtml(ans), wr.map(function (w) { return C.rubyHtml(w); }));
  }
  function order(s, gp) {
    var toks = s.orderTokens;
    return {
      id: 'q' + (++seq), kind: 'order', item: gp, section: 'gram', listening: false, type: 'order', sent: s,
      prompt: { ko: s.ko, q: '뜻에 맞게 순서대로 고르세요', audioBtn: s.plain },
      tokens: U.shuffle(toks.map(function (t, i) { return { i: i, html: C.rubyHtml(t), text: t }; })),
      answerSeq: toks,
      reveal: sentReveal(s)
    };
  }
  function canOrder(s) { return s.orderTokens.length >= 3 && s.orderTokens.length <= 9; }

  function gramQ(gp, prefer) {
    var s = U.pick(gp.x);
    if (prefer === 'listen') return sentListen(s, gp, 'listen');
    var clozes = gp.x.filter(function (x) { return x.cloze; });
    if (prefer !== 'noCloze' && clozes.length && (prefer === 'cloze' || Math.random() < 0.55)) return cloze(U.pick(clozes), gp);
    var orderable = gp.x.filter(canOrder);
    if (orderable.length && Math.random() < 0.6) return order(U.pick(orderable), gp);
    return sentListen(s, gp, 'listen');
  }
  function lineQ(l) { return sentListen(l.s, l, 'listen'); }

  /* ---------- 장면 대화 청해 ---------- */
  function dlgQ(dl) {
    return mkChoice({
      item: dl, section: 'listen', listening: true, type: 'dialog', dlg: dl,
      prompt: { dialog: dl.lines, q: dl.q.q },
      optCls: 'ko-opt',
      reveal: { dialog: dl.lines }
    }, dl.q.a, dl.q.w.slice(0, 3));
  }

  /* ---------- 소리 구별 ---------- */
  function pairQ(p, day) {
    var pickA = Math.random() < 0.5;
    var target = pickA ? p[0] : p[1];
    var opts = U.shuffle([{ label: p[0], value: pickA ? 'A' : 'W0' }, { label: p[1], value: pickA ? 'W0' : 'A' }]);
    return {
      id: 'q' + (++seq), kind: 'choice', type: 'pair', item: { id: 'pair', ch: JP.days[day].ch, type: 'pair' },
      section: 'listen', listening: true,
      prompt: { audio: target, q: '어느 쪽으로 들리나요?' },
      optCls: 'jp-opt',
      options: opts, answer: 'A',
      reveal: { big: target, sub: (pickA ? p[2] : p[3]), note: p[0] + ' = ' + p[2] + ' / ' + p[1] + ' = ' + p[3], audio: target }
    };
  }

  /* ---------- 짝 맞추기 ---------- */
  function matchQ(items) {
    var seenR = {};
    items = items.filter(function (it) {
      var r = it.type === 'kana' ? it.ro : it.m;
      if (seenR[r]) return false; seenR[r] = 1; return true;
    });
    var pairs = items.slice(0, 5).map(function (it) {
      if (it.type === 'kana') return { id: it.id, l: it.c, r: it.ro, audio: it.c };
      return { id: it.id, l: it.r, r: it.m, audio: it.r };
    });
    return { id: 'q' + (++seq), kind: 'match', type: 'match', section: 'vocab', pairs: pairs, left: U.shuffle(pairs), right: U.shuffle(pairs), item: items[0] };
  }

  /* ---------- 항목 → 임의 유형 ---------- */
  function qFor(item, bias) {
    if (item.type === 'kana') {
      if (bias === 'listen') return kanaListen(item);
      return U.pick([kanaRead, kanaListen, kanaFromRomaji])(item);
    }
    if (item.type === 'vocab') {
      if (bias === 'listen') return vocabListen(item);
      return U.pick([vocabMeaning, vocabListen, vocabReverse])(item);
    }
    if (item.type === 'gram') return gramQ(item, bias);
    if (item.type === 'line') return lineQ(item);
    return null;
  }

  /* ---------- 오늘의 항목 ---------- */
  function dayItems(D) {
    return {
      kana: D.kana || [],
      vocab: D.vocab || [],
      gram: (D.gram || []).filter(function (x) { return x.x.length; }),
      line: D.line
    };
  }
  function confuseKana(D) {
    var out = [];
    (D.confuse || []).forEach(function (grp) { grp.split('').forEach(function (c) { if (JP.kana.byChar[c]) out.push(JP.kana.byChar[c]); }); });
    return U.uniq(out);
  }
  function earlierItems(day, n) {
    var st = JP.store.state;
    var weak = JP.srs.weakest(20).map(function (id) { return JP.items[id]; })
      .filter(function (it) { return it && it.day < day && it.type !== 'line'; });
    var pool = weak.length >= n ? weak : weak.concat(C.itemsInRange(Math.max(1, day - 20), day - 1).filter(function (it) { return it.type !== 'line'; }));
    return U.sample(U.uniq(pool), n);
  }

  /* ---------- 학습 단계: 연습 ---------- */
  function practice(day) {
    var D = JP.days[day], I = dayItems(D), qs = [];
    if (I.kana.length) {
      I.kana.forEach(function (k) { qs.push(kanaRead(k)); });
      for (var i = 0; i < I.kana.length; i += 5) {
        var chunk = I.kana.slice(i, i + 5);
        if (chunk.length >= 3) qs.push(matchQ(U.shuffle(chunk)));
      }
      U.sample(I.kana, Math.min(6, I.kana.length)).forEach(function (k) { qs.push(U.pick([kanaListen, kanaFromRomaji])(k)); });
    }
    confuseKana(D).forEach(function (k) { qs.push(kanaRead(k)); });
    if (I.vocab.length) {
      I.vocab.forEach(function (v) { qs.push(vocabMeaning(v)); });
      qs.push(matchQ(U.sample(I.vocab, 5)));
      U.sample(I.vocab, Math.ceil(I.vocab.length / 2)).forEach(function (v) { qs.push(vocabListen(v)); });
    }
    I.gram.forEach(function (gp) {
      gp.x.forEach(function (s, idx) {
        if (s.cloze) qs.push(cloze(s, gp));
        else if (canOrder(s) && idx % 2 === 0) qs.push(order(s, gp));
        else qs.push(sentListen(s, gp, 'listen'));
      });
    });
    (D.pairs || []).forEach(function (p) { qs.push(pairQ(p, day)); });
    if (D.dlg) {
      U.sample(D.dlg.lines, 2).forEach(function (ln) { qs.push(sentListen(ln.s, D.dlg, 'listen')); });
      qs.push(dlgQ(D.dlg));
    }
    // 너무 길지 않게: 26문항 상한 (짝 맞추기·빈칸은 유지)
    if (qs.length > 26) {
      var keep = qs.filter(function (q) { return q.kind !== 'choice' || q.type === 'cloze' || q.type === 'pair' || q.type === 'dialog'; });
      var rest = U.shuffle(qs.filter(function (q) { return keep.indexOf(q) < 0; })).slice(0, Math.max(0, 26 - keep.length));
      qs = qs.filter(function (q) { return keep.indexOf(q) >= 0 || rest.indexOf(q) >= 0; });
    }
    return qs;
  }

  /* ---------- 오늘의 평가 (10문항) ---------- */
  function test(day) {
    var D = JP.days[day], I = dayItems(D), qs = [];
    var kana = U.shuffle(I.kana), vocab = U.shuffle(I.vocab), gram = U.shuffle(I.gram);
    var ck = confuseKana(D);
    if (kana.length) {
      var kinds = [kanaRead, kanaListen, kanaFromRomaji];
      kana.slice(0, 5).forEach(function (k, i) { qs.push(kinds[i % 3](k)); });
    }
    if (ck.length) U.sample(ck, 3).forEach(function (k) { qs.push(kanaRead(k)); });
    if (vocab.length) {
      var vk = [vocabListen, vocabMeaning, vocabReverse, vocabListen];
      vocab.slice(0, kana.length ? 2 : 4).forEach(function (v, i) { qs.push(vk[i % vk.length](v)); });
    }
    gram.slice(0, 2).forEach(function (gp, i) { qs.push(gramQ(gp, i === 0 ? 'cloze' : 'noCloze')); });
    if (D.dlg) qs.push(dlgQ(D.dlg));
    else if (I.line) qs.push(lineQ(I.line));
    if (D.pairs && D.pairs.length) qs.push(pairQ(U.pick(D.pairs), day));
    earlierItems(day, 2).forEach(function (it) { var q = qFor(it); if (q) { q.review = true; qs.push(q); } });
    // 10문항 맞추기
    var fillers = U.shuffle([].concat(kana.slice(5), vocab.slice(4), gram.slice(2), I.kana, I.vocab));
    var guard = 0;
    while (qs.length < 10 && fillers.length && guard++ < 40) {
      var q = qFor(fillers[guard % fillers.length], Math.random() < 0.4 ? 'listen' : null);
      if (q) qs.push(q);
    }
    qs = ensureListening(qs.slice(0, 10), 3, D);
    return U.shuffle(qs).slice(0, 10);
  }
  // 청해 문항 최소 개수 보장
  function ensureListening(qs, min, D) {
    var n = qs.filter(function (q) { return q.listening; }).length;
    for (var i = 0; i < qs.length && n < min; i++) {
      var q = qs[i];
      if (q.listening || q.review) continue;
      var it = q.item;
      if (it && (it.type === 'vocab' || it.type === 'kana')) { qs[i] = qFor(it, 'listen'); n++; }
    }
    return qs;
  }

  /* ---------- 워밍업 / 복습 ---------- */
  function forItems(ids, n) {
    return ids.slice(0, n).map(function (id) { var q = qFor(JP.items[id]); if (q) q.srsId = id; return q; }).filter(Boolean);
  }

  /* ---------- 보스전 ---------- */
  function boss(day) {
    var D = JP.days[day];
    var items = C.itemsInRange(D.range[0], D.range[1]);
    var byDay = {};
    items.forEach(function (it) { (byDay[it.day] = byDay[it.day] || []).push(it); });
    var picked = [];
    var dayKeys = Object.keys(byDay);
    var r = 0;
    while (picked.length < 20 && r < 10) {
      dayKeys.forEach(function (k) { var arr = byDay[k]; if (arr.length && picked.length < 20) picked.push(arr.splice(Math.floor(Math.random() * arr.length), 1)[0]); });
      r++;
    }
    var qs = U.shuffle(picked).map(function (it, i) { return qFor(it, i % 3 === 0 ? 'listen' : null); }).filter(Boolean);
    return qs.slice(0, 20);
  }

  /* ---------- 청해 특훈 (15문항, 점점 빠르게) ---------- */
  function listen(day) {
    var D = JP.days[day];
    var items = C.itemsInRange(D.range[0], D.range[1], ['vocab', 'gram', 'line']);
    var lines = items.filter(function (i) { return i.type === 'line' || i.type === 'gram'; });
    var vocab = items.filter(function (i) { return i.type === 'vocab'; });
    var pairs = [];
    for (var d = D.range[0]; d <= D.range[1]; d++) if (JP.days[d] && JP.days[d].pairs) JP.days[d].pairs.forEach(function (p) { pairs.push([p, d]); });
    var qs = [];
    U.sample(vocab, 5).forEach(function (v) { qs.push(vocabListen(v)); });
    U.sample(lines, 8).forEach(function (it) { qs.push(it.type === 'line' ? lineQ(it) : gramQ(it, 'listen')); });
    U.sample(pairs, 2).forEach(function (pp) { qs.push(pairQ(pp[0], pp[1])); });
    var dls = C.dialogsInRange(D.range[0], D.range[1]);
    if (dls.length) { qs = U.shuffle(qs).slice(0, 11); U.sample(dls, 4).forEach(function (dl) { qs.push(dlgQ(dl)); }); }
    while (qs.length < 15 && vocab.length) qs.push(vocabListen(U.pick(vocab)));
    qs = U.shuffle(qs).slice(0, 15);
    var rates = [0.9, 0.9, 0.9, 0.9, 0.9, 1, 1, 1, 1, 1, 1.15, 1.15, 1.15, 1.2, 1.25];
    qs.forEach(function (q, i) { q.rate = rates[i]; q.stage = i < 5 ? 1 : i < 10 ? 2 : 3; });
    return qs;
  }

  /* ---------- 승급 시험 (30문항, 영역별 채점) ---------- */
  function exam(day) {
    var D = JP.days[day];
    var items = C.itemsInRange(D.range[0], D.range[1]);
    var kana = items.filter(function (i) { return i.type === 'kana'; });
    var vocab = items.filter(function (i) { return i.type === 'vocab'; });
    var gram = items.filter(function (i) { return i.type === 'gram'; });
    var clozeG = gram.filter(function (gp) { return gp.x.some(function (x) { return x.cloze; }) || gp.x.some(canOrder); });
    var lines = items.filter(function (i) { return i.type === 'line'; });
    var qs = [];
    var nKana = kana.length ? 6 : 0;
    var nGram = clozeG.length ? Math.min(8, clozeG.length * 2) : 0;
    var nVocab = 30 - 8 - nKana - nGram;
    U.sample(kana, nKana).forEach(function (k, i) { qs.push((i % 2 ? kanaFromRomaji : kanaRead)(k)); });
    U.sample(vocab, nVocab).forEach(function (v, i) { qs.push((i % 2 ? vocabReverse : vocabMeaning)(v)); });
    for (var j = 0; j < nGram; j++) {
      var q = gramQ(clozeG[j % clozeG.length], j % 2 ? 'noCloze' : 'cloze');
      if (q.listening) q = gramQ(clozeG[j % clozeG.length], 'cloze');
      q.section = 'gram';
      qs.push(q);
    }
    var lpool = U.shuffle(lines.map(function (l) { return { f: lineQ, it: l }; })
      .concat(U.sample(vocab, 6).map(function (v) { return { f: vocabListen, it: v }; }))
      .concat(U.sample(gram, 4).map(function (gp) { return { f: function (x) { return gramQ(x, 'listen'); }, it: gp }; })));
    var dls = C.dialogsInRange(D.range[0], D.range[1]);
    var nDlg = Math.min(3, dls.length);
    U.sample(dls, nDlg).forEach(function (dl) { qs.push(dlgQ(dl)); });
    lpool.slice(0, 8 - nDlg).forEach(function (p) { var q = p.f(p.it); q.section = 'listen'; qs.push(q); });
    while (qs.length < 30 && vocab.length) qs.push(vocabMeaning(U.pick(vocab)));
    var order = { kana: 0, vocab: 1, gram: 2, listen: 3 };
    return qs.slice(0, 30).sort(function (a, b) { return order[a.section] - order[b.section]; });
  }

  JP.quiz = {
    practice: practice, test: test, boss: boss, listen: listen, exam: exam,
    forItems: forItems, qFor: qFor, dayItems: dayItems, dlgQ: dlgQ,
    _t: { kanaRead: kanaRead, kanaListen: kanaListen, vocabMeaning: vocabMeaning, vocabListen: vocabListen, vocabReverse: vocabReverse, cloze: cloze, order: order, sentListen: sentListen, pairQ: pairQ, matchQ: matchQ }
  };
})(typeof window !== 'undefined' ? window : globalThis);

/* ---- js/drill.js ---- */
/* 어려운 문제 · 복습
 *  1. 입력: 일본어 자판으로 친 가나·한자를 그대로 채점. 자판이 없을 때를 위해 로마자(shigoto)나
 *     한글 자판 그대로 친 것(ㄴ노ㅑ…)도 누른 자판으로 되돌려 가나로 바꿈. 전각 영문·반각 가타카나도 보통 글자로
 *  2. 채점: 가나·한자 표기, 장음 표기(ー/う/お), 조사 は·へ·を를 わ·え·お로 쓴 것, では/じゃ, 변환 후보에서
 *     다른 한자를 고른 것 같은 차이를 구별해 맞음 / 맞음(표기 주의) / 틀림으로 판정

    return selfQ({ item: k, section: 'kana', listening: false, type: 'kanaRecall',
      prompt: { big: k.c, cls: 'jp-big', q: '이 글자의 소리를 떠올려 보세요' }, revealAudio: k.c,
      answerHtml: C.escapeHtml(k.ro), reveal: { big: k.c, sub: k.ro, audio: k.c } });
  }
  function kanaDictation(k) {
    return inputQ({ item: k, section: 'listen', listening: true, type: 'kanaDictation',
      prompt: { audio: k.c, q: '들리는 글자를 쓰세요' },
      answers: [{ k: hira(k.c) }], answerLabel: C.escapeHtml(k.c), reveal: { big: k.c, sub: k.ro, audio: k.c } });
  }
  // 빈칸 직접 쓰기 (문장 + 뜻을 보고)
  function tokenAnswer(tok) { return { k: C.toReading(tok.src), w: C.stripRuby(tok.src), particle: PARTICLES.indexOf(C.stripRuby(tok.src)) >= 0 }; }
  function blankHtml(s, idx) {
    return s.tokens.map(function (t, i) { return i === idx ? '<span class="blank">＿＿</span>' + C.escapeHtml(t.punct || '') : C.rubyHtml(t.full); }).join('');
  }
  function clozeInput(s, gp, idx, type) {
    var tok = s.tokens[idx];
    return inputQ({ item: gp, section: 'gram', listening: false, type: type || 'clozeInput', sent: s,
      prompt: { html: blankHtml(s, idx), ko: s.ko, q: '빈칸에 들어갈 말을 쓰세요' },
      answers: [tokenAnswer(tok)], answerLabel: C.rubyHtml(tok.src), reveal: sentReveal(s) });
  }
  // 듣고 빈칸 받아쓰기
  function dictCloze(s, item, idx) {
    var tok = s.tokens[idx];
    return inputQ({ item: item, section: 'listen', listening: true, type: 'dictCloze', sent: s,
      prompt: { audio: s.plain, html: blankHtml(s, idx), q: '듣고 빈칸의 말을 쓰세요' },
      answers: [tokenAnswer(tok)], answerLabel: C.rubyHtml(tok.src), reveal: sentReveal(s) });
  }
  // 소리 구별: 듣고 쓰기 (둘 중 하나를 찍어 맞히지 못하게)
  function pairInput(q) {
    var target = q.prompt.audio;
    return inputQ({ item: q.item, section: 'listen', listening: true, type: 'pairInput',
      prompt: { audio: target, q: '들리는 말을 쓰세요' }, answers: [{ k: target }], answerLabel: C.escapeHtml(target), reveal: q.reveal });
  }
  // 떠올린 뒤 스스로 채점
  function selfQ(base) { base.kind = 'self'; base.id = 'd' + (++seq); return base; }
  function vocabRecall(v, listening) {
    return selfQ({ item: v, section: listening ? 'listen' : 'vocab', listening: !!listening, type: listening ? 'listenRecall' : 'vocabRecall',
      prompt: listening ? { audio: v.r, q: '듣고 뜻을 떠올려 보세요' } : { big: v.r, cls: 'jp-word', q: '뜻을 떠올려 보세요', audioBtn: v.r },
      answerHtml: C.escapeHtml(v.m), reveal: vocabReveal(v) });
  }
  function sentRecall(s, item, listening) {
    return selfQ({ item: item, section: listening ? 'listen' : 'gram', listening: !!listening, type: listening ? 'sentListenRecall' : 'sentRecall', sent: s,
      prompt: listening ? { audio: s.plain, q: '듣고 뜻을 떠올려 보세요' } : { html: s.html, q: '뜻을 떠올려 보세요', audioBtn: s.plain },
      answerHtml: C.escapeHtml(s.ko), reveal: sentReveal(s) });
  }
  function gramRecall(gp) {
    var ex = gp.x[0];
    return selfQ({ item: gp, section: 'gram', listening: false, type: 'gramRecall',
      prompt: { big: gp.t, cls: 'jp-word', q: '이 문법의 뜻과 쓰임을 떠올려 보세요' },
      answerHtml: C.escapeHtml(gp.m), reveal: ex ? sentReveal(ex) : null });
  }
  // 문법 뜻 문제는 제목이 일본어 형태(〜ては いけない 등)이고 뜻이 한국어인 항목만 (글자 단원의 '헷갈리는 히라가나 짝', '동사 ます형' 같은 주제 제목은 제외)
  function titleOk(gp) { var t = String(gp.t).replace(/\([^)]*\)|（[^）]*）/g, ''); return /[ぁ-んァ-ヶ]/.test(t) && !/[가-힣]/.test(t) && /[가-힣]/.test(gp.m || ''); }
  // 문법 뜻 고르기 (제목 → 뜻)
  function gramMeaning(gp) {
    var pool = U.shuffle(JP.all.gram.filter(function (x) { return x !== gp && titleOk(x) && x.m !== gp.m && Math.abs(x.day - gp.day) <= 40; }));
    var wr = [], seen = {};
    pool.forEach(function (x) { if (wr.length < 3 && !seen[x.m]) { seen[x.m] = 1; wr.push(x.m); } });
    var ex = gp.x[0];
    var opts = [{ label: gp.m, value: 'A' }].concat(wr.map(function (l, i) { return { label: l, value: 'W' + i }; }));
    return { id: 'd' + (++seq), kind: 'choice', item: gp, section: 'gram', listening: false, type: 'gramMeaning',
      prompt: { big: gp.t, cls: 'jp-word', q: '이 문법의 뜻은?' }, optCls: 'ko-opt', options: U.shuffle(opts), answer: 'A',
      reveal: ex ? sentReveal(ex) : null };
  }
  // 조각 맞추기: 문장 배열 + 가짜 조각
  function orderDecoy(q) {
    var s = q.sent, toks = q.answerSeq, decoys = [];
    if (s && s.cloze && s.cloze.opts.length) decoys.push(U.pick(s.cloze.opts));
    var plainToks = toks.map(C.stripRuby);
    toks.forEach(function (t) {
      var p = C.stripRuby(t).replace(/[。、！？!?…]+$/, '');
      if (decoys.length < 2 && PART_CONF[p] && Math.random() < 0.6) { var alt = U.pick(PART_CONF[p]); if (plainToks.indexOf(alt) < 0) decoys.push(alt); }
    });
    if (decoys.length < 1 && q.item && q.item.type === 'gram') {
      var other = U.pick(q.item.x.concat(q.item.more || []).filter(function (x) { return x !== s; }));
      if (other) { var ot = U.pick(other.orderTokens); if (ot && toks.indexOf(ot) < 0) decoys.push(ot); }
    }
    decoys = U.uniq(decoys).filter(function (d) { return toks.indexOf(d) < 0; }).slice(0, 2);
    if (!decoys.length) return q;
    var tokens = toks.map(function (t, i) { return { i: i, html: C.rubyHtml(t), text: t }; })
      .concat(decoys.map(function (d, j) { return { i: toks.length + j, html: C.rubyHtml(d), text: d, decoy: true }; }));
    return Object.assign({}, q, { id: 'd' + (++seq), type: 'orderDecoy', tokens: U.shuffle(tokens), need: toks.length,
      prompt: { ko: q.prompt.ko, q: '뜻에 맞게 순서대로 고르세요 (필요 없는 조각이 섞여 있어요)' } });
  }
  // 단어 조각 맞추기: 뜻 → 가나 조각을 순서대로 (헷갈리는 조각 2~3개 섞음)
  var MORA_CONF = {};
  (function () {
    var pairs = ['かが', 'きぎ', 'くぐ', 'けげ', 'こご', 'さざ', 'しじ', 'すず', 'せぜ', 'そぞ', 'ただ', 'ちぢ', 'つづ', 'てで', 'とど', 'はばぱ', 'ひびぴ', 'ふぶぷ', 'へべぺ', 'ほぼぽ',
      'ぬめ', 'ねれわ', 'るろ', 'あお', 'いり', 'つっ', 'やゃ', 'ゆゅ', 'よょ', 'おう', 'えい'];
    pairs.forEach(function (p) { var cs = p.split(''); cs.forEach(function (c) { MORA_CONF[c] = (MORA_CONF[c] || []).concat(cs.filter(function (x) { return x !== c; })); }); });
  })();
  function vocabTiles(v) {
    var word = v.r.replace(/[〜~]/g, ''), ms = morae(word);
    if (ms.length < 2 || ms.length > 8) return vocabWrite(v);
    var kata = /[ァ-ヶ]/.test(word);
    var decoys = [];
    U.shuffle(ms).forEach(function (m) {
      if (decoys.length >= 3) return;
      var h = hira(m[0]), alts = MORA_CONF[h];
      if (alts && alts.length) { var a = U.pick(alts); var d = (kata ? JP.kana.toKata(a) : a) + m.slice(1); if (ms.indexOf(d) < 0 && decoys.indexOf(d) < 0) decoys.push(d); }
    });
    if (decoys.length < 2) decoys.push(kata ? 'ッ' : 'っ');
    var tokens = ms.map(function (m, i) { return { i: i, html: C.escapeHtml(m), text: m }; })
      .concat(decoys.map(function (d, j) { return { i: ms.length + j, html: C.escapeHtml(d), text: d, decoy: true }; }));
    return { id: 'd' + (++seq), kind: 'order', item: v, section: 'vocab', listening: false, type: 'vocabTiles',
      prompt: { ko: v.m, q: '뜻에 맞는 말을 조각으로 만드세요 (필요 없는 조각이 섞여 있어요)' },
      tokens: U.shuffle(tokens), answerSeq: ms, need: ms.length, reveal: vocabReveal(v) };
  }

  /* ---------- 예문에서 빈칸 고르기 ---------- */
  var PUNCT_ONLY = /^[。、！？!?…‥・「」『』（）()〜~ー]+$/;
  function gramForms(gp) {
    if (gp._forms) return gp._forms;
    var A = {}, T2 = {};
    gp.x.forEach(function (s) { if (s.cloze) A[C.stripRuby(s.cloze.answer)] = 1; });
    String(gp.t).replace(/\([^)]*\)|（[^）]*）/g, ' ').split(/[\s\/・·,、]+/).forEach(function (x) {
      x = x.replace(/[〜~]/g, '').trim(); if (x && /[ぁ-んァ-ヶ]/.test(x) && !/[가-힣]/.test(x)) T2[x] = 1;
    });
    return (gp._forms = { ans: A, title: T2 });
  }
  // 문법의 핵심 형태가 들어 있는 토큰 위치 (없으면 -1)
  function gramTarget(s, gp) {
    if (s.cloze) return s.cloze.index;
    var F = gramForms(gp), i;
    for (i = 0; i < s.tokens.length; i++) if (F.ans[s.tokens[i].plain]) return i;
    for (i = 0; i < s.tokens.length; i++) if (F.title[s.tokens[i].plain]) return i;
    return -1;
  }
  function particleTarget(s) {
    var idx = [];
    s.tokens.forEach(function (t, i) { if (PART_CONF[t.plain]) idx.push(i); });
    return idx.length ? U.pick(idx) : -1;
  }
  // 받아쓰기 빈칸: 배운 단어와 같은 토큰을 먼저, 없으면 2~6박의 내용어
  function dictTarget(s) {
    var known = {}, cand = [], good = [];
    JP.all.vocab.forEach(function (v) { if (JP.srs.get(v.id)) { known[hira(v.r)] = 1; if (v.w) known[v.w] = 1; } });
    s.tokens.forEach(function (t, i) {
      var k = hira(t.kana), n = morae(k).length;
      if (PUNCT_ONLY.test(t.plain) || PART_CONF[t.plain] || n < 2 || n > 7) return;
      cand.push(i); if (known[k] || known[t.plain]) good.push(i);
    });
    return good.length ? U.pick(good) : cand.length ? U.pick(cand) : -1;
  }
  // 빈칸 보기 문제 (마크업에 빈칸이 없는 예문도): 정답 + 같은 문법의 다른 형태·헷갈리는 조사
  function clozeChoice(s, gp, idx) {
    var tok = s.tokens[idx], ans = tok.src, p = tok.plain, wr = [];
    if (s.cloze && idx === s.cloze.index) return T().cloze(s, gp);
    if (PART_CONF[p]) wr = PART_CONF[p].slice();
    else {
      var F = gramForms(gp);
      gp.x.forEach(function (x) { if (x.cloze) wr = wr.concat([x.cloze.answer].concat(x.cloze.opts)); });
      wr = wr.concat(Object.keys(F.title));
    }
    wr = U.uniq(wr.map(function (w) { return w; })).filter(function (w) { return C.stripRuby(w) !== p; });
    wr = U.shuffle(wr).slice(0, 3);
    if (wr.length < 3) wr = wr.concat(U.shuffle(PARTICLES.filter(function (x) { return x !== p && wr.indexOf(x) < 0; }))).slice(0, 3);
    var opts = [{ label: C.rubyHtml(ans), value: 'A' }].concat(wr.map(function (w, i) { return { label: C.rubyHtml(w), value: 'W' + i }; }));
    return { id: 'd' + (++seq), kind: 'choice', item: gp, section: 'gram', listening: false, type: 'cloze', sent: s, blank: idx,
      prompt: { html: blankHtml(s, idx), ko: s.ko, q: '빈칸에 알맞은 말은?' }, optCls: 'jp-opt', optHtml: true,
      options: U.shuffle(opts), answer: 'A', reveal: sentReveal(s) };
  }

  /* ================= 5. 난이도 ================= */
  function level() { var s = JP.store.state; return (s && s.settings.level) || 'mid'; }
  var CHANCE = { easy: 0, mid: 0.45, hard: 1 };
  var GRADED_CTX = { test: 1, boss: 1, listenTest: 1, exam: 1 };
  // 보기 문제 하나를 난이도에 맞는 유형으로 (graded: 평가·보스·시험에서는 스스로 채점 문제를 쓰지 않음)
  function hardenOne(q, ctx, lv) {
    lv = lv || level();
    if (!q || Math.random() >= CHANCE[lv]) return q;
    var graded = !!GRADED_CTX[ctx], voice = JP.speech.hasJa(), it = q.item, s = q.sent;
    var nq = null;
    switch (q.type) {
      case 'kanaRead': nq = !graded ? kanaRecall(it) : voice ? kanaDictation(it) : null; break;
      case 'kanaListen': if (voice) nq = kanaDictation(it); break;
      case 'vocabReverse': nq = lv === 'mid' && Math.random() < 0.5 ? vocabTiles(it) : vocabWrite(it); break;
      case 'vocabListen': if (voice) nq = Math.random() < 0.7 || graded ? vocabDictation(it) : vocabRecall(it, true); break;
      case 'vocabMeaning':
        if (!graded) nq = vocabRecall(it);
        else if (it.w && /[㐀-鿿]/.test(it.w) && Math.random() < 0.5) nq = kanjiRead(it);
        break;
      case 'cloze':
        var bi = q.blank != null ? q.blank : (s && s.cloze ? s.cloze.index : -1);
        if (s && bi >= 0) nq = clozeInput(s, it, bi);
        break;
      case 'gramMeaning': if (!graded) nq = gramRecall(it); break;
      case 'sentMeaning': if (!graded && s) nq = sentRecall(s, it, false); break;
      case 'order': nq = orderDecoy(q); break;
      case 'sentListen':
        if (voice && s) {
          var di = dictTarget(s);
          if (di >= 0 && (graded || Math.random() < 0.6)) nq = dictCloze(s, it, di);
          else if (!graded) nq = sentRecall(s, it, true);

    if (!nq) return q;
    ['rate', 'stage', 'review', 'srsId', 'drillId'].forEach(function (k) { if (q[k] !== undefined) nq[k] = q[k]; });
    if (ctx === 'exam') nq.section = q.section;          // 승급 시험은 영역별 점수라 원래 영역 그대로
    return nq;
  }
  function harden(qs, ctx) {
    var lv = level();
    if (lv === 'easy') return qs;
    return qs.map(function (q) { return hardenOne(q, ctx, lv); });
  }

  /* ================= 6. 복습 ================= */
  function drillState() {
    var s = JP.store.state;
    if (!s.drill || typeof s.drill !== 'object') s.drill = {};
    var d = s.drill;
    d.sets = d.sets || 0; d.ans = d.ans || 0; d.ok = d.ok || 0; d.seen = d.seen || {}; d.kind = d.kind || 'mix';
    return d;
  }
  function learned() {
    var srs = JP.store.state.srs, out = [];
    Object.keys(srs).forEach(function (id) { var it = JP.items[id]; if (it) out.push(it); });
    return out;
  }
  function learnedDays() {
    var days = {};
    learned().forEach(function (it) { days[it.day] = 1; });
    return Object.keys(days).map(Number);
  }
  function counts() {
    var c = { kana: 0, vocab: 0, gram: 0, line: 0, ex: 0 };
    learned().forEach(function (it) { c[it.type] = (c[it.type] || 0) + 1; if (it.type === 'gram') c.ex += it.x.length + (it.more || []).length; });
    return c;
  }
  // 오래 안 본 것(복습 세트에 한 번도 안 나온 것이 가장 먼저) + 자주 틀린 것 + 기억 단계가 낮은 것
  function priority(it, d) {
    var srs = JP.store.state.srs[it.id] || [1, 0, 0, 0], seen = d.seen[it.id];
    var age = seen ? (d.sets - seen[0]) : 99;
    var sc = seen ? Math.min(4, age / 3) : 5;
    var bad = (seen ? seen[2] : 0) + srs[3], good = (seen ? seen[1] : 0) + srs[2];
    sc += Math.min(3, bad / Math.max(1, good) * 3);
    if (srs[0] <= 2) sc += 1;
    if (seen && age <= 1) sc -= 6;                    // 바로 앞 세트에 나온 것은 뒤로 (세트 번호는 세트를 마칠 때 올라감)
    return sc + Math.random() * 2;
  }
  function pickExample(gp) {
    var all = gp.x.concat(gp.more || []);
    return all.length ? U.pick(all) : null;
  }
  function voice() { return JP.speech.hasJa(); }
  // 항목 하나 → 문제 하나 (kind: 고른 종류, listenOnly: 듣기 문제만)
  function makeQ(it, listenOnly) {
    var t = T(), q = null, r = Math.random();
    if (it.type === 'kana') {
      q = listenOnly && voice() ? t.kanaListen(it) : U.pick([t.kanaRead, t.kanaListen])(it);
    } else if (it.type === 'vocab') {
      if (listenOnly) q = t.vocabListen(it);
      else if (it.w && /[㐀-鿿]/.test(it.w) && r < 0.2) q = level() === 'easy' ? confusedMeaning(it) : kanjiRead(it);
      else q = U.pick([confusedMeaning, confusedReverse, function (v) { return voice() ? t.vocabListen(v) : confusedMeaning(v); }])(it);
    } else if (it.type === 'gram') {
      var s = pickExample(it);
      if (!s) return null;
      if (listenOnly) {
        var di = voice() ? dictTarget(s) : -1;
        q = di >= 0 && level() !== 'easy' ? dictCloze(s, it, di) : sentMeaning(s, it, true);
      } else {
        var gi = gramTarget(s, it), pi = particleTarget(s);
        var opts = [];
        if (gi >= 0) opts.push('gram', 'gram');
        if (pi >= 0) opts.push('particle');
        if (s.orderTokens.length >= 3 && s.orderTokens.length <= 9) opts.push('order');
        opts.push('meaning');
        if (voice()) opts.push('listen');
        if (titleOk(it)) opts.push('title');
        var kind = U.pick(opts);
        if (kind === 'gram') q = clozeChoice(s, it, gi);
        else if (kind === 'particle') q = clozeChoice(s, it, pi);
        else if (kind === 'order') q = t.order(s, it);
        else if (kind === 'meaning') q = sentMeaning(s, it, false);
        else if (kind === 'listen') { var d2 = dictTarget(s); q = d2 >= 0 && level() !== 'easy' ? dictCloze(s, it, d2) : sentMeaning(s, it, true); }
        else q = gramMeaning(it);
      }
    } else if (it.type === 'line') {
      var di2 = voice() ? dictTarget(it.s) : -1;
      if (listenOnly || r < 0.5) q = di2 >= 0 && level() !== 'easy' && r < 0.3 ? dictCloze(it.s, it, di2) : sentMeaning(it.s, it, true);
      else if (it.s.orderTokens.length >= 3 && it.s.orderTokens.length <= 9) q = t.order(it.s, it);
      else q = sentMeaning(it.s, it, false);
    } else if (it.type === 'dlg') {
      q = JP.quiz.dlgQ(it);
    } else if (it.type === 'pairItem') {
      q = t.pairQ(it.p, it.day);
    }
    return q;
  }
  // 헷갈리는 보기로 만든 단어 문제
  function confusedMeaning(v) {
    var wr = confusableVocab(v, 3);
    var opts = [{ label: v.m, value: 'A' }].concat(wr.map(function (x, i) { return { label: x.m, value: 'W' + i }; }));
    return { id: 'd' + (++seq), kind: 'choice', item: v, section: 'vocab', listening: false, type: 'vocabMeaning',
      prompt: { big: v.r, cls: 'jp-word', small: v.w && v.w !== v.r ? v.w : '', ro: romajiOn(v) ? (v.ro || C.romaji(v.r)) : '', q: '뜻을 고르세요', audioBtn: v.r },
      options: U.shuffle(opts), answer: 'A', reveal: vocabReveal(v) };
  }
  function confusedReverse(v) {
    var wr = confusableVocab(v, 3);
    var opts = [{ label: v.r, value: 'A' }].concat(wr.map(function (x, i) { return { label: x.r, value: 'W' + i }; }));
    return { id: 'd' + (++seq), kind: 'choice', item: v, section: 'vocab', listening: false, type: 'vocabReverse',
      prompt: { big: v.m, cls: 'ko-big', q: '일본어로 고르세요' }, optCls: 'jp-opt', options: U.shuffle(opts), answer: 'A', reveal: vocabReveal(v) };
  }
  function sentMeaning(s, item, listening) {
    var wr = sentDistractors(s, item, 3);

  function say(text, rate, btn) {
    SP.unlock();

    if (btn) { if (playing) playing.classList.remove('playing'); btn.classList.add('playing'); playing = btn; }
    return SP.speak(text, { rate: rate || 1 }).then(function () { if (btn) btn.classList.remove('playing'); });
  }

    opts = opts || {};

  }
  // 다른 목소리로 듣기: 네 목소리 녹음이 있는 말만. 누를 때마다 다음 목소리로 재생하고 그 이름을 보여 줌
  // (방금 기본으로 들은 녹음과 같은 목소리는 건너뜀 — 녹음이 같으면 색인의 위치도 같음)
  function voiceList(text) {
    if (!text || !SP.useClips() || !JP.SPEAKERS) return [];
    var E = JP.clips.entry, same = function (a, b) { return !!(a && b && a[0] === b[0] && a[1] === b[1] && a[2] === b[2]); };
    var pick = st().settings.speaker, base = E(JP.audioKey(text, pick || 'f'));
    return JP.SPEAKERS.map(function (s) { return s[0]; }).filter(function (v) { var e = E(JP.audioKey(text, v)); return e && !same(e, base); });
  }
  function voiceBtn(text, rate) {
    if (voiceList(text).length < 2) return '';
    return '<button class="voice-btn" data-act="sayVoice" data-t="' + esc(text) + '" data-r="' + (rate || 1) + '" data-i="-1" aria-label="다른 목소리로 듣기">' + I.cycle + '<span>다른 목소리</span></button>';
  }
  // 대화 재생: 화자마다 목소리(또는 음높이)를 다르게
  function playDialog(lines, rate, onLine) {
    var i = 0, speakers = [];
    lines.forEach(function (l) { if (speakers.indexOf(l.who) < 0) speakers.push(l.who); });
    function next() {
      if (i >= lines.length || !run && !playDialog.free) { if (onLine) onLine(-1); return; }
      var l = lines[i], si = speakers.indexOf(l.who);
      if (onLine) onLine(i);
      var u = SP.speak(l.s.plain, { rate: rate || 1, voice: si % 2 ? 'm' : 'f' });
      i++;
      u.then(function () { setTimeout(next, 280); });
    }
    next();
  }

  /* ================= 홈: 코스 ================= */
  function dayBrief(D) {
    if (D.type !== 'lesson') return '';

    if (D.kana.length) parts.push('새 글자 <b>' + D.kana.length + '</b>');

  }
  function viewHome() {

        '<button class="btn block" data-act="start" data-day="' + cur + '">' + I.play + (todayN ? ' 다음 화 이어서 하기' : ' 오늘의 에피소드 시작') + '</button>') +

      (todayN >= 2 ? '<p class="small muted" style="margin:8px 0 0">오늘은 이미 ' + todayN + '화를 마쳤어요. 기억은 잠을 자는 동안 정리되기 때문에, 하루 1~2화에 복습을 곁들이는 편이 오래 남습니다.</p>' : '') +
      '</section>';

      var lock = !s.settings.unlockAll && !isUnlocked((c.n - 1) * 30 + 1);
      return '<button class="chap ' + (ui.chapter === c.n ? 'on' : '') + (lock ? ' lock' : '') + '" data-act="chap" data-v="' + c.n + '" role="tab" aria-selected="' + (ui.chapter === c.n) + '">' +
        '<div class="n">第' + c.n + '章 · ' + c.rankFrom + '→' + c.rankTo + '</div><div class="t">' + esc(c.title) + '</div><div class="r jp">' + esc(c.jp) + '</div></button>';

  }
  function cellHtml(d, cur) {
    var D = JP.days[d], p = prog(d), lock = !isUnlocked(d);
    var cls = 'cell ' + (D.type !== 'lesson' ? D.type : '') + (d === cur && !isDone(d) ? ' cur' : '') + (lock ? ' lock' : '') + (p && p.pass ? ' done' : '');
    var ic = D.type === 'boss' ? I.sword : D.type === 'listen' ? I.headphones : D.type === 'exam' ? I.scroll : '';
    var inner = p && p.pass ? '<span class="stamp">' + stampSvg(p.grade) + '</span><span class="num-under">' + d + '</span>' : String(d);
    return '<button class="' + cls + '" data-act="sheet" data-day="' + d + '" aria-label="' + d + '화 ' + esc(D.title) + (p && p.pass ? ' 완료' : lock ? ' 잠김' : '') + '">' + (ic ? '<span class="ic">' + ic + '</span>' : '') + inner + '</button>';
  }
  function stampCard(ch, cur) {
    var base = (ch.n - 1) * 30, html = '<section class="stampcard"><header><h3>第' + ch.n + '章 ' + esc(ch.title) + '</h3><span class="jp">' + esc(ch.jp) + '</span></header>';
    html += '<p class="small muted" style="margin:0 4px 10px">' + esc(ch.goal) + '</p>';
    for (var w = 0; w < 4; w++) {

      for (var i = 1; i <= 7; i++) html += cellHtml(base + w * 7 + i, cur);

    }
    html += '<div class="weekrow lastrow"><span class="wk">마무리</span>' + cellHtml(base + 29, cur) + cellHtml(base + 30, cur) + '<span class="small muted" style="padding-left:6px;line-height:1.3">청해 특훈 · 승급 시험 <b style="color:var(--shu)">' + ch.rankTo + '급</b></span></div>';

  /* ================= 복습 탭 ================= */

  // 기억 현황: 단계별 항목 수 + 자주 틀리는 항목(접어 둠)

  function itemLabel(it) {

    html += '<section class="card stack"><div class="eyebrow">탁음 · 반탁음</div><div class="kgrid">' + JP.kana.dakuGrid.map(function (row) { return row.map(function (c) { return kcell(conv(c)); }).join(''); }).join('') + '</div></section>';

  function kanaExample(k) {

  function kanaDetailHtml(k, inCard) {

  /* 쓰기 연습 패드 */
  function initPads() {
    U.$$('canvas.pad').forEach(function (cv) {
      if (cv._init) return; cv._init = true; cv._guide = true;
      var ctx = cv.getContext('2d'), drawing = false, last = null;
      function guide() {
        ctx.clearRect(0, 0, cv.width, cv.height);
        var cs = getComputedStyle(document.documentElement);
        ctx.strokeStyle = cs.getPropertyValue('--line'); ctx.lineWidth = 3; ctx.setLineDash([12, 12]);
        ctx.beginPath(); ctx.moveTo(300, 0); ctx.lineTo(300, 600); ctx.moveTo(0, 300); ctx.lineTo(600, 300); ctx.stroke(); ctx.setLineDash([]);
        if (cv._guide) {
          ctx.fillStyle = cs.getPropertyValue('--muted'); ctx.globalAlpha = .28;
          ctx.font = '600 430px "Klee One", serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(cv.dataset.glyph, 300, 318); ctx.globalAlpha = 1;
        }
      }
      cv._guideFn = guide;
      if (document.fonts && document.fonts.load) document.fonts.load('600 60px "Klee One"', cv.dataset.glyph).then(guide, guide); else guide();
      function pos(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; }
      cv.addEventListener('pointerdown', function (e) { drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); });
      cv.addEventListener('pointermove', function (e) {
        if (!drawing) return; var p = pos(e);
        ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink'); ctx.lineWidth = 22; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p;
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { cv.addEventListener(ev, function () { drawing = false; }); });
    });
  }

  /* ================= 학습 노트 (단어 · 문법 · 대사 · 인문학) ================= */
  // 문법 한 항목 전체: 핵심 설명 → 예문 → 왜 그럴까 → 예문 더 보기 → 비교·주의 → 애니에서는
  function paras(t) { return String(t).split('\n\n').map(function (p) { return '<p>' + p + '</p>'; }).join(''); }
  function gramHtml(g, noTitle) {
